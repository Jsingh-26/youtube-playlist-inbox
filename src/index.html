<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#0f0f0f">
  <title>YouTube Inbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      font-size: 16px;
    }

    /* ── Header ── */
    .header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid #1e1e1e;
      position: sticky;
      top: 0;
      background: #0f0f0f;
      z-index: 10;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .yt-logo {
      width: 32px;
      height: 32px;
      background: #FF0000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .yt-logo svg { width: 18px; height: 18px; fill: white; }
    .header h1 { font-size: 19px; font-weight: 700; }

    /* ── Add input ── */
    .add-row { display: flex; gap: 10px; }
    .add-row input {
      flex: 1;
      height: 48px;
      padding: 0 14px;
      background: #1e1e1e;
      border: 1.5px solid #2e2e2e;
      border-radius: 12px;
      font-size: 15px;
      color: #fff;
      outline: none;
      -webkit-appearance: none;
    }
    .add-row input::placeholder { color: #555; }
    .add-row input:focus { border-color: #FF0000; }
    .add-row button {
      height: 48px;
      padding: 0 20px;
      background: #FF0000;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .add-row button:active { opacity: 0.85; transform: scale(0.97); }
    .add-row button:disabled { background: #333; color: #666; }
    .error-msg {
      font-size: 13px;
      color: #ff6b6b;
      margin-top: 8px;
      min-height: 18px;
      padding-left: 2px;
    }

    /* ── List ── */
    .list-section { padding: 16px; }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }

    /* ── Playlist card ── */
    .playlist-card {
      background: #161616;
      border-radius: 16px;
      margin-bottom: 16px;
      overflow: hidden;
      border: 1px solid #1e1e1e;
    }
    .playlist-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
    }
    .pl-icon {
      width: 42px;
      height: 42px;
      background: #FF0000;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pl-icon svg { width: 22px; height: 22px; fill: white; }
    .pl-info { flex: 1; min-width: 0; }
    .pl-name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pl-count { font-size: 12px; color: #555; margin-top: 3px; }
    .remove-btn {
      width: 40px;
      height: 40px;
      background: #222;
      border: none;
      color: #666;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .remove-btn:active { background: #2a1515; color: #ff6b6b; }

    /* ── Video rows ── */
    .videos-list { border-top: 1px solid #1e1e1e; }
    .video-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #1a1a1a;
      text-decoration: none;
      min-height: 72px;
    }
    .video-row:last-child { border-bottom: none; }
    .video-row:active { background: #1e1e1e; }
    .thumb {
      width: 96px;
      height: 54px;
      border-radius: 8px;
      background: #222;
      flex-shrink: 0;
      overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-title {
      font-size: 14px;
      color: #ddd;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── States ── */
    .loading {
      text-align: center;
      color: #444;
      font-size: 15px;
      padding: 48px 20px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #222;
      border-top-color: #FF0000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state {
      text-align: center;
      color: #444;
      font-size: 15px;
      padding: 48px 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="yt-logo">
        <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
      </div>
      <h1>YouTube Inbox</h1>
    </div>
    <div class="add-row">
      <input type="url" id="urlInput" placeholder="Paste playlist URL..." autocomplete="off" />
      <button id="addBtn" onclick="addPlaylist()">Add</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="list-section">
    <div class="section-label">Tracked playlists</div>
    <div id="listContainer">
      <div class="loading">
        <div class="spinner"></div>
        Loading...
      </div>
    </div>
  </div>

  <script>
    function loadPlaylists() {
      document.getElementById('listContainer').innerHTML =
        '<div class="loading"><div class="spinner"></div>Loading...</div>';
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(() => {
          document.getElementById('listContainer').innerHTML =
            '<div class="empty-state">Could not load playlists.<br>Try refreshing.</div>';
        })
        .getPlaylistsWithVideos();
    }

    function render(list) {
      const c = document.getElementById('listContainer');
      if (!list || list.length === 0) {
        c.innerHTML = '<div class="empty-state">No playlists tracked yet.<br>Paste a URL above to add one.</div>';
        return;
      }

      c.innerHTML = list.map(p => {
        const videos = p.videos || [];
        const videosHtml = videos.length === 0
          ? ''
          : videos.map(v => `
              <a class="video-row" href="https://www.youtube.com/watch?v=${v.videoId}" target="_blank">
                <div class="thumb">
                  <img src="https://img.youtube.com/vi/${v.videoId}/mqdefault.jpg" loading="lazy" />
                </div>
                <div class="video-title">${esc(v.title)}</div>
              </a>
            `).join('');

        return `
          <div class="playlist-card">
            <div class="playlist-header">
              <div class="pl-icon">
                <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
              </div>
              <div class="pl-info">
                <div class="pl-name">${esc(p.title)}</div>
                <div class="pl-count">${videos.length} recent video${videos.length !== 1 ? 's' : ''}</div>
              </div>
              <button class="remove-btn" onclick="removePlaylist('${p.id}')">✕</button>
            </div>
            <div class="videos-list">${videosHtml}</div>
          </div>
        `;
      }).join('');
    }

    function addPlaylist() {
      const input = document.getElementById('urlInput');
      const error = document.getElementById('errorMsg');
      const btn = document.getElementById('addBtn');
      error.textContent = '';
      if (!input.value.trim()) { error.textContent = 'Paste a playlist URL first.'; return; }
      btn.disabled = true;
      btn.textContent = '...';

      google.script.run
        .withSuccessHandler(result => {
          btn.disabled = false;
          btn.textContent = 'Add';
          if (result.error) { error.textContent = result.error; return; }
          input.value = '';
          loadPlaylists();
        })
        .withFailureHandler(() => {
          btn.disabled = false;
          btn.textContent = 'Add';
          error.textContent = 'Something went wrong. Try again.';
        })
        .addPlaylist(input.value);
    }

    function removePlaylist(id) {
      if (!confirm('Stop tracking this playlist?')) return;
      google.script.run.withSuccessHandler(loadPlaylists).removePlaylist(id);
    }

    function esc(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadPlaylists();
  </script>
</body>
</html>
